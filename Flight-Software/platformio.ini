; PlatformIO Project Configuration
; CanSat 2026 - Team LeoNUS Flight Software
; Target: Teensy 4.1

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; Build flags
build_flags = 
    -D TEAM_ID=1000
    -D DEBUG_SERIAL=1
    -Wall
    -Wextra

; Serial monitor
monitor_speed = 115200

; Library dependencies
lib_deps = 
    Wire
    SPI
    SD
    Servo

; Upload settings
upload_protocol = teensy-cli
